services:
  homelens:
    image: ${HOMELENS_IMAGE:-homelens:0.2.4-arm64}
    container_name: home-homelens
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    ports:
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-18793}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
